name: CI/CD

# Executa em Pull Requests para a main, em pushes na main e em tags de versão (v1.0.0, v1.1.0...)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

# Permissão mínima por padrão (somente leitura do código)
permissions:
  contents: read

jobs:
  ci:
    name: Validar e testar
    runs-on: ubuntu-latest
    steps:
      - name: Obter código-fonte (checkout)
        uses: actions/checkout@v7

      - name: Preparar ambiente Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Validar aplicação (compilação)
        run: python -m compileall -q app tests

      - name: Verificação de segurança (dependências vulneráveis)
        run: pip-audit -r requirements.txt

      - name: Executar testes automatizados
        run: python -m pytest -v

  docker:
    name: Gerar artefato (imagem Docker)
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Obter código-fonte (checkout)
        uses: actions/checkout@v7

      - name: Definir tags da imagem
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=ref,event=pr

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
